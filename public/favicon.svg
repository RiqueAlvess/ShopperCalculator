<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#161b22"/>
      <stop offset="100%" stop-color="#0f1117"/>
    </linearGradient>
  </defs>
  <rect width="100" height="100" rx="22" fill="url(#bg)"/>
  <!-- Speedometer arc -->
  <path d="M18 68 A32 32 0 1 1 82 68" stroke="#39ff14" stroke-width="6" stroke-linecap="round" fill="none"/>
  <!-- Ticks -->
  <line x1="50" y1="36" x2="50" y2="28" stroke="#39ff14" stroke-width="4" stroke-linecap="round"/>
  <line x1="29" y1="43" x2="24" y2="38" stroke="#39ff14" stroke-width="3" stroke-linecap="round" opacity=".6"/>
  <line x1="71" y1="43" x2="76" y2="38" stroke="#39ff14" stroke-width="3" stroke-linecap="round" opacity=".6"/>
  <!-- Needle — pointing right/fast zone -->
  <line x1="50" y1="68" x2="72" y2="47" stroke="#39ff14" stroke-width="5" stroke-linecap="round"/>
  <circle cx="50" cy="68" r="6" fill="#39ff14"/>
  <!-- Dollar -->
  <text x="32" y="94" fill="#39ff14" font-size="22" font-weight="800" font-family="system-ui,sans-serif">$</text>
  <text x="52" y="94" fill="white" font-size="18" font-weight="600" font-family="system-ui,sans-serif" opacity=".4">¢</text>
</svg>
